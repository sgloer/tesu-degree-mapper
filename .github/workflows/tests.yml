name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: degree_mapper
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Load schema, seed, and index
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -uroot -proot degree_mapper < sql/001_schema.sql
          mysql -h 127.0.0.1 -uroot -proot degree_mapper < sql/002_seed.sql
          mysql -h 127.0.0.1 -uroot -proot degree_mapper < sql/004_index.sql
      - name: Build PHP image
        run: docker build -t degree-mapper-php .
      - name: Install dependencies
        run: docker run --rm -v "$PWD:/app" -w /app degree-mapper-php composer install
      - name: Run tests
        run: docker run --rm -v "$PWD:/app" -w /app --network host -e DB_HOST=127.0.0.1 degree-mapper-php vendor/bin/phpunit
